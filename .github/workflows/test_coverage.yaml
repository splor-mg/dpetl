name: Test Coverage

on:
  push:
    branches:
      - main
    paths-ignore:
      - coverage.svg
  workflow_dispatch:

permissions:
  contents: write
  actions: read
  issues: write

jobs:
  test-coverage:
    name: Create coverage badge
    runs-on: ubuntu-latest
    steps:
      - name: Get job ID
        id: job_id
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          JOB_ID=$(gh api \
            /repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/jobs \
            --jq '.jobs[0].id')
          echo "job_id=$JOB_ID" >> "$GITHUB_OUTPUT"

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up python
        id: setup-python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          virtualenvs-create: true
          virtualenvs-in-project: true
          installer-parallel: true

      - name: Load cached venv
        id: cached-poetry-dependencies
        uses: actions/cache@v4
        with:
          path: .venv
          key: venv-${{ runner.os }}-${{ steps.setup-python.outputs.python-version }}-${{ hashFiles('**/poetry.lock') }}

      - name: Install dependencies
        if: steps.cached-poetry-dependencies.outputs.cache-hit != 'true'
        run: poetry install --no-interaction

      - name: Run tests with coverage and update badge
        run: |
          poetry run task test
          poetry run task coverage_badge

      - name: Publish coverage badge
        run: |
          git add coverage.svg
          git commit -m "Create/Update coverage badge main branch" || true
          git push origin HEAD:${{ github.ref_name }}

      - name: Workflow failure notification
        if: failure()
        uses: JasonEtco/create-an-issue@v2
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          JOB_ID: ${{ steps.job_id.outputs.job_id }}
          WORKFLOW_NAME: ${{ github.workflow }}
        with:
          filename: .github/failure.md
