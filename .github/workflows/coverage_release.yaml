name: Coverage and Release

on:
  push:
    branches:
      - main
    paths-ignore:
      - coverage.svg
  workflow_dispatch:

permissions:
  contents: write
  actions: read
  issues: write

jobs:
  test-coverage:
    name: Create coverage badge
    runs-on: ubuntu-latest
    if: ${{ !contains(github.actor, '[bot]') && github.ref == 'refs/heads/main' }}
    steps:
      - name: Get job ID
        id: job_id
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          JOB_ID=$(gh api \
            /repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/jobs \
            --jq '[.jobs[] | select(.status=="in_progress")][0].id')
          echo "job_id=$JOB_ID" >> "$GITHUB_OUTPUT"

      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: Configure Git
        run: |
          git config --global user.name '${{ steps.app-token.outputs.app-slug }}[bot]'
          git config --global user.email '${{ steps.app-token.outputs.app-slug }}[bot]@users.noreply.github.com'

      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      - name: Setup Python
        id: setup-python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          virtualenvs-create: true
          virtualenvs-in-project: true
          installer-parallel: true

      - name: Load cached venv
        id: cached-poetry-dependencies
        uses: actions/cache@v4
        with:
          path: .venv
          key: venv-${{ runner.os }}-${{ steps.setup-python.outputs.python-version }}-${{ hashFiles('**/poetry.lock') }}-github-app

      - name: Install dependencies
        if: steps.cached-poetry-dependencies.outputs.cache-hit != 'true'
        run: poetry install --no-interaction --extras github-app

      - name: Run tests with coverage and update badge
        run: |
          poetry run task test
          poetry run task coverage_badge

      - name: Publish coverage badge
        run: |
          git add coverage.svg
          git commit -m "Update coverage badge" || true
          git push origin HEAD:main

      - name: Workflow failure notification
        if: failure()
        uses: JasonEtco/create-an-issue@v2
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          JOB_ID: ${{ steps.job_id.outputs.job_id }}
          WORKFLOW_NAME: ${{ github.workflow }}
        with:
          filename: .github/failure.md

  release:
    name: Release package
    runs-on: ubuntu-latest
    needs: test-coverage
    if: ${{ !contains(github.actor, '[bot]') && github.ref == 'refs/heads/main' }}
    steps:
      - name: Get job ID
        id: job_id
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          JOB_ID=$(gh api \
            /repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/jobs \
            --jq '[.jobs[] | select(.status=="in_progress")][0].id')
          echo "job_id=$JOB_ID" >> "$GITHUB_OUTPUT"

      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: Configure Git
        run: |
          git config --global user.name '${{ steps.app-token.outputs.app-slug }}[bot]'
          git config --global user.email '${{ steps.app-token.outputs.app-slug }}[bot]@users.noreply.github.com'

      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      - name: Setup Python
        id: setup-python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          virtualenvs-create: true
          virtualenvs-in-project: true
          installer-parallel: true

      - name: Load cached venv
        id: cached-poetry-dependencies
        uses: actions/cache@v4
        with:
          path: .venv
          key: venv-${{ runner.os }}-${{ steps.setup-python.outputs.python-version }}-${{ hashFiles('**/poetry.lock') }}-github-app

      - name: Install dependencies
        if: steps.cached-poetry-dependencies.outputs.cache-hit != 'true'
        run: poetry install --no-interaction --extras github-app

      - name: Bump version
        run: poetry run cz bump

      - name: Publish package
        env:
          POETRY_PYPI_TOKEN_PYPI: ${{ secrets.PYPI_TOKEN }}
        run: |
          poetry publish --build -n

      - name: Push bump commit and tag
        run: |
          git push origin HEAD:main --tags

      - name: Workflow failure notification
        if: failure()
        uses: JasonEtco/create-an-issue@v2
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          JOB_ID: ${{ steps.job_id.outputs.job_id }}
          WORKFLOW_NAME: ${{ github.workflow }}
        with:
          filename: .github/failure.md
