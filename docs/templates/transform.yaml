  # Column renaming
  - name: customers
    path: data/customers.csv
    schema:
      fields:
        - name: Name
          type: string
          target: customer_name
        - name: Region
          type: string
          target: customer_region
    dpetl_transform:
      format: csv.gz   # optional (Defaults to csv.gz)
      path: data/processed   # optional (Defaults to data)
      encoding: utf-8   # optional (Defaults to utf-8)
      delimiter: ';'   # optional (Defaults to ,)

  # Anonymization of sensitive fields
  - name: employees
    path: data/employees.csv
    schema:
      fields:
        - name: employee_name
          type: string
          target: name_hashed
          anonymize:
            method: '[#***]'
        - name: tax_id
          type: string
          target: tax_id_encrypted
          anonymize:
            method: aes_siv
            context: department
            annotation: TAX:11
            filter: 'department == "Finance"'
        - name: phone
          type: string
          anonymize:
            method: '[###-***-####]'

  # External command
  - name: payroll
    path: data/payroll.csv
    dpetl_transform:
      cli:
        arguments:   # required. List of shell commands to run sequentially
          - python scripts/clean_payroll.py
        path: data/processed   # optional (Defaults to dpetl_transform.path)
        pre_process: true   # optional (Defaults to true)
        stdin: true   # optional (Defaults to false)

# Package level. Passed to every cli command as an environment variable
custom:
  - year: 2027
    region: south
