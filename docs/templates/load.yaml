# Load configuration (defined once per package)
dpetl_load:
  owner: github-username
  repo: my-data-repo
  level: user   # optional (Defaults to user)
  visibility: private   # optional (Defaults to private)
  target: github   # optional (Defaults to github). Use postgres to load data into Postgres
  # schema: my_schema   # optional (Defaults to the package name). Postgres schema used when target: postgres
  # lfs:   # optional. Sends large data files to Git LFS (or lfs: true for the defaults)
  #   threshold: 50   # optional (Defaults to 50). Size in MB above which a file goes to LFS
  #   patterns: [data/*.csv.gz]   # optional (Defaults to any data file)
  #   url: https://lfs.example.com/{owner}/{repo}   # optional (Defaults to the GitHub LFS storage)

# Linktable configuration (defined once per package, optional)
# dpetl_linktable:
#   facts: ['vlr_*']   # required. Field names or glob patterns of the facts ([] for dimensions only)
#   resource_list:   # required. Resources used to build the linktable
#     - execucao   # uses the package facts
#     - name: empenho   # overrides the package facts for this resource
#       facts: ['vlr_*', 'qtd_*']
