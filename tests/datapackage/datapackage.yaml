name: test_datapackage
title: Pacote de testes compartilhado entre extract, transform e load

resources:
  - name: acao
    type: table
    path: data_raw/acao_previous.csv
    scheme: multipart
    format: csv
    mediatype: text/csv
    extrapaths:
      - data_raw/acao_current.csv
    encoding: utf-8
    schema:
      fields:
        - name: Ano de Exercício
          type: string
          target: ano
        - name: Projeto_Atividade - Código
          type: string
          target: acao_cod
        - name: Projeto_Atividade - Descrição
          type: string
          target: acao_desc
    dpetl_extract:
      mode: email
      mailbox: '[Gmail]/Trash'
      criteria:
        subject: acao
    dpetl_transform:
      format: csv

  - name: api_resource
    type: table
    path: data_raw/api_data.csv
    format: csv
    schema:
      fields:
        - name: id
          type: string
        - name: value
          type: string
    dpetl_extract:
      mode: api
      sources:
        - method: GET
          path: https://api.example.com/data
          headers:
            Authorization: Bearer token
    dpetl_transform:
      format: csv

  - name: static_resource
    type: table
    path: data_raw/static.csv
    format: csv
    schema:
      fields:
        - name: col1
          type: string
          target: nova_col1
    dpetl_transform:
      format: csv
      path: data/processed

  - name: basic
    path: data/basic.csv
    scheme: file
    format: csv
    schema:
      fields:
        - name: col1
          type: string
    dpetl_transform:
      format: csv

  - name: renamed
    path: data/renamed.csv
    scheme: file
    format: csv
    schema:
      fields:
        - name: col1
          type: string
          target: nova_col1
    dpetl_transform:
      format: csv

  - name: anonymized
    path: data/anonymized.csv
    scheme: file
    format: csv
    schema:
      fields:
        - name: col1
          type: string
          anonymize:
            method: sha256
        - name: col2
          type: string
          anonymize:
            method: aes_siv
        - name: col3
          type: string
          anonymize:
            method: '[###-###]'
        - name: col4
          type: string
          anonymize:
            method: sha256
            annotation: 'short:1|long:2'
        - name: flag
          type: string
        - name: col5
          type: string
          anonymize:
            method: sha256
            filter: 'flag == "x"'
    dpetl_transform:
      format: csv

  - name: cli_resource
    path: data/cli_resource.csv
    scheme: file
    format: csv
    schema:
      fields:
        - name: col1
          type: string
    dpetl_transform:
      format: csv
      cli:
        arguments:
          - echo ok

dpetl_load:
  owner: test_owner
  repo: test_repo
